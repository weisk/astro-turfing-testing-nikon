name: Build & Test (dev)

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch: {}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Enable Corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          npm install -g pnpm@latest
          pnpm -v

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # - name: Lint (if configured)
      #   run: pnpm run lint
      #   continue-on-error: false
      #   if: ${{ hashFiles('package.json') || true }} # run when lint script exists; action will fail if lint script not present

      # - name: Type check (if configured)
      #   run: pnpm run type-check
      #   if: ${{ always() }} # keep step, will fail only if script is present and errors

      - name: Run tests (if configured)
        run: pnpm test --silent
        continue-on-error: false
        if: ${{ always() }}

      - name: Build
        run: pnpm run build
